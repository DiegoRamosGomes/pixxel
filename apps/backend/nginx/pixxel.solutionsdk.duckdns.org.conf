# Config nginx pra subdomínio do pixxel-backend.
# Caminho na VPS: /var/docker/sites/nginx/sites/pixxel.solutionsdk.duckdns.org.conf
#
# Espelha o padrão de integral.solutionsdk.duckdns.org.conf:
#  - HTTP (80) → ACME challenge + redirect 301
#  - HTTPS (443) → proxy pro container pixxel_backend:3000
#  - resolver docker DNS pra resolver pixxel_backend dinâmicamente
#  - WebSocket upgrade pra /ws

# HTTP → ACME + redirect
server {
    listen 80;
    server_name pixxel.solutionsdk.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/webroot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — webhooks + WebSocket
server {
    listen 443 ssl;
    server_name pixxel.solutionsdk.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/pixxel.solutionsdk.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pixxel.solutionsdk.duckdns.org/privkey.pem;

    # Webhook payloads do Expo são pequenos, mas folga pra outros providers.
    client_max_body_size 5M;

    # Não bufferiza pra latência baixa (webhooks + WS streaming).
    proxy_buffering off;
    proxy_request_buffering off;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $pixxel_backend pixxel_backend;

    location / {
        proxy_pass http://$pixxel_backend:3000;
        proxy_http_version 1.1;

        # Upgrade pra WebSocket (rota /ws). Headers funcionam pra HTTP normal também.
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Timeout alto pra WS ficar aberto enquanto desktop estiver vivo.
        proxy_read_timeout 86400;
    }
}
